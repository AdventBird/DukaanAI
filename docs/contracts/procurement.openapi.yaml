openapi: 3.0.3
info:
  title: DukaanAI Procurement & Supplier Management API
  version: 0.1.0
  description: API specifications for Supplier Directory, Quotes, Purchase Orders, Goods Receipt, and Mock Portal.
paths:
  /api/suppliers:
    get:
      summary: Search and list active/archived suppliers
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: includeArchived
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of suppliers
    post:
      summary: Register a new distributor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name: { type: string }
                phone: { type: string }
                preferredContactMethod:
                  type: string
                  enum: [PHONE, WHATSAPP, EMAIL, PORTAL, MANUAL]
      responses:
        '210':
          description: Supplier registered

  /api/supplier-quotes/compare:
    post:
      summary: Deterministically normalize and compare multiple supplier quotes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteIds]
              properties:
                quoteIds:
                  type: array
                  items: { type: string }
                productId: { type: string }
      responses:
        '200':
          description: Normalized comparison matrix and explainable AI recommendation

  /api/purchase-orders:
    post:
      summary: Create draft purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplierId, items]
              properties:
                supplierId: { type: string }
                supplierQuoteId: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [productId, quantityInPurchasePacks]
      responses:
        '201':
          description: Draft purchase order created

  /api/purchase-orders/{id}/approve:
    post:
      summary: Owner approves financial commitment for exact revision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, decisionNote]
              properties:
                expectedRevision: { type: integer }
                decisionNote: { type: string }
      responses:
        '200':
          description: Order approved

  /api/goods-receipts/{id}/confirm:
    post:
      summary: Physically confirm delivery and atomically post accepted stock to inventory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                idempotencyKey: { type: string }
                verificationNote: { type: string }
      responses:
        '200':
          description: Receipt confirmed and stock balance updated
